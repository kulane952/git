<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100">

<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-slate-900 text-white p-6 hidden md:block">
    <h1 class="text-2xl font-bold mb-8">My Dashboard</h1>

    <ul class="space-y-4">
      <li class="hover:bg-slate-700 p-2 rounded cursor-pointer">Dashboard</li>
      <li class="hover:bg-slate-700 p-2 rounded cursor-pointer">Transactions</li>
      <li class="hover:bg-slate-700 p-2 rounded cursor-pointer">Income</li>
      <li class="hover:bg-slate-700 p-2 rounded cursor-pointer">Expenses</li>
      <li class="hover:bg-slate-700 p-2 rounded cursor-pointer">Settings</li>
    </ul>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-6">

    <!-- Header -->
    <header class="mb-6">
      <h1 class="text-3xl font-bold text-slate-800">Expense Tracker</h1>
      <p class="text-slate-500">Track income & expenses easily</p>
    </header>

    <!-- CARDS -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">

      <div class="bg-white p-5 rounded-xl shadow">
        <h3>Balance</h3>
        <p id="balance" class="text-2xl font-bold">$0</p>
      </div>

      <div class="bg-white p-5 rounded-xl shadow">
        <h3>Income</h3>
        <p id="income" class="text-2xl font-bold text-green-500">$0</p>
      </div>

      <div class="bg-white p-5 rounded-xl shadow">
        <h3>Expense</h3>
        <p id="expense" class="text-2xl font-bold text-red-500">$0</p>
      </div>

    </section>

    <!-- ADD -->
    <section class="bg-white p-5 rounded-xl shadow mb-6">

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">

        <input id="name" placeholder="Name"
          class="border p-2 rounded">

        <input id="amount" type="number" placeholder="Amount"
          class="border p-2 rounded">

        <select id="type" class="border p-2 rounded">
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>

        <button id="addBtn"
          class="bg-blue-500 text-white rounded p-2 hover:bg-blue-600">
          Add
        </button>

      </div>

    </section>

    <!-- TABLE -->
    <section class="bg-white p-5 rounded-xl shadow">

      <table class="w-full">
        <thead class="bg-slate-200">
          <tr>
            <th class="p-2 text-left">Name</th>
            <th class="p-2 text-left">Amount</th>
            <th class="p-2 text-left">Type</th>
            <th class="p-2 text-left">Action</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>
      </table>

    </section>

  </main>

</div>

<script src="./app.js"></script>
</body>
</html>
