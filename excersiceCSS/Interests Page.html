<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interests Page</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .interest-section{
            width: 80vh;
            height: 50vh;
            margin: 5vh;
            padding: 20px;
        }
        #books{
            background-color: #ADD8E6;
            
        }
        #movies{
            background-color: #D3D3D3;
        }
        #foods{
            background-color: #90EE90;
        }
        h1{
            font-family: 'Arial', sans-serif;
            text-align: center;
            font-size: 24px;
        }

        p{
            font-family: 'Georgia', serif;
            text-align: center;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="interest-section" id="books">
        <h1>Books name</h1>
        <p>List your favorite books here!</p>
        <ul>
            <li>Atomic Habits</li>
            <li>Deep Work</li>
            <li>The Alchemist</li>
        </ul>
    </div>
    <div class="interest-section" id="movies">
        <h1>Movies</h1>
        <p>List your favorite movies here!</p>
        <ul>
            <li>Inception</li>
            <li>The Matrix</li>
            <li>Interstellar</li>
    </div>
    <div class="interest-section" id="foods">
        <h1>Foods</h1>
        <p>List your favorite foods here!</p>
        <ul>
            <li>Pizza</li>
            <li>Sushi</li>
            <li>Chocolate</li>
    </div>
</body>
</html>
