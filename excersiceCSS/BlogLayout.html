<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Layout</title>

<style>

/* RESET */
body{
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

/* HEADER */
.header{
    background-color: #333;
    color: white;
    padding: 10px;
    text-align: center;
}

.wrapper{
     display: flex;
    min-height: 100vh;
    justify-content:left; 
    gap: 500px; 
    padding: 0px;
    width: 100%;
}

/* SIDEBAR NAV */
nav{
    width: 220px;
    background-color: #cec6c6;
    padding: 20px;
}

nav ul{
    list-style: none;
    margin: 0;
    padding: 0;

    display: flex;
    flex-direction: column;
    gap: 20px;
}

nav ul li a{
    color: black;
    text-decoration: none;
    font-weight: bold;
}

nav ul li a:hover{
    color: blue;
}

/* MAIN CONTENT */
.main{
    flex: 1;
    padding: 20px;
}

/* BLOG IMAGE */
.main img{
    width: 60%;
    height: auto;
    margin-bottom: 20px;
    border: 1px solid #333;
    border-radius: 5px;
}

/* BUTTON */
button{
    padding: 10px 20px;
    background-color: rgb(17, 61, 131);
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    display: block;
    margin-bottom: 20px;
}

/* FOOTER */
footer{
    background-color: #333;
    color: white;
    text-align: center;
    padding: 10px;
}


</style>

</head>

<body>

<header class="header">
    <h1>My Blog</h1>
</header>

<div class="wrapper">

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main">

        <article>
            <h2>Blog Post Title</h2>
            <p>Post in April 10, 2023</p>
        </article>
        <img src="https://images.pexels.com/photos/35785111/pexels-photo-35785111.jpeg" alt="">
        <button>Read More</button>

        <article>
            <h2>Blog Post Title</h2>
            <p>Post in April 10, 2023</p>
        </article>
        <img src="https://images.pexels.com/photos/34670929/pexels-photo-34670929.jpeg" alt="">
        <button>Read More</button>

        <article>
            <h2>Blog Post Title</h2>
            <p>Post in April 10, 2023</p>
        </article>
        <img src="https://images.pexels.com/photos/21405617/pexels-photo-21405617.jpeg" alt="">
        <button>Read More</button>

        <article>
            <h2>Blog Post Title</h2>
            <p>Post in April 10, 2023</p>
        </article>
        <img src="https://images.pexels.com/photos/34054488/pexels-photo-34054488.jpeg" alt="">
        <button>Read More</button>

    </main>

</div>

<footer>
    <p>&copy; 2023 My Blog. All rights reserved.</p>
</footer>

</body>
</html>
