<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> webpage layout </title>
</head>
<style>
    .navbar{
       color: #1c1ea8f8;
       font-size: large;
       text-align: center;
       margin: 20px;
    }
    #box1{
        background-color: #000;
        color: white;
        padding: 20px;
        margin: 20px;

    }
    #box2{
        background-color: #333;
        color: white;
        padding: 20px;
        margin: 20px;
    }
    #box3{
        background-color: #666;
        color: white;
        padding: 20px;
        margin: 20px;
    }

    footer{
        background-color: #333;
        text-align: center;
        padding: 40px;
    }
</style>

<body>
    <nav class="navbar">Navigation Bar</nav>
    <div class="content-box" id="box1">Content Box 1</div>
    <div class="content-box" id="box2">Content Box 2</div>
    <div class="content-box" id="box3">Content Box 3</div>
    <footer class="footer">Footer</footer>


</body>

</html>
