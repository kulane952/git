<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eature Section</title>
    <style>
       

        .feature-section {
            background-color: lightblue;
            background-image: url('https://images.pexels.com/photos/16985140/pexels-photo-16985140.jpeg');
            width: 100vw;
            height: 300px;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding: 20px;
            flex-direction: column;
        }
        .feature-section h2{
            font-size: 50px;
            margin-bottom: 15px;
        }
        .feature-section p{
            font-size: 20px;
        }
    </style>
</head>

<body>
    <div class="feature-section">
        <h2>Special Offer</h2>
        <p>Don't miss out on our exclusive deal available this week only!</p>
    </div>

</body>

</html>
