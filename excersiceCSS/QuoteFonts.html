<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Fonts</title>
    <style>
        h1{
            font-family: 'Arial', sans-serif;
        }
        blockquote{
            font-style: italic;
        }

        footer{
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Quote Fonts</h1>
    <blockquote>
        "The only way to do great work is to love what you do."
        <footer>— Steve Jobs</footer>
    </blockquote>
    
</body>
</html>
