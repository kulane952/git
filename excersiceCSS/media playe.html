<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>media playe</title>
    <style>
        .media-player {
            display: flex;
            width: 50%;
            justify-content: center;
            gap: 20px;
            padding: 10px 20px;
            margin: 10px auto;
            
        }
        .control-button-prev{
            background-color: blue;
            flex: 1;
            color: white;

        }
        .control-button-play{
            background-color: green;
            flex: 2;
            color: white;
        }
        .control-button-next{
            background-color: red;
            flex: 1;
            color: white;
            
        }
    </style>
</head>
<body>
    <div class="media-player">
    <button class="control-button-prev">Prev</button>
    <button class="control-button-play">Play</button>
    <button class="control-button-next">Next</button>
</div>

    
</body>
</html>
