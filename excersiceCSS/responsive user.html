<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>responsive user</title>
    <style>
        .profile-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 10px;
        }

        .card {
            background-color: #f0f0f0;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 200px;
            text-align: center;
            padding: 20px;
        }
        .card:hover{
            transform: translate(0, -5px);
        }

        .card img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .card .info h2 {
            margin: 0;
            font-size: 1.5em;
        }

        .card .info p {
            color: #777;
            margin: 10px 0;
        }

        .card .info a {
            text-decoration: none;
            color: #007BFF;
            font-weight: bold;
        }

        .card .info a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .card {
                width: 100%;
            }
        }
    </style>
</head>
