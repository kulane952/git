<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Gallery</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #b2acac;
            padding: 20px;
        }
        .quote {
           font-size: large;
           font-family: 'Courier New', Courier, monospace;
           height: 150px;
        }

        #quote1 {
            background-color: #393ccf;
            border: 3px solid #ffffff;
            padding: 15px;
            width: 200px;
            margin: 20px;
        }

        #quote2 {
            background-color: #48ce4a;
            border: 3px dotted #ffffff;
            padding: 15px;
            width: 200px;
            margin: 20px;
        }

        #quote3 {
            background-color: #ddd567;
            border: 3px dashed #ffffff;
            padding: 15px;
            width: 200px;
            margin: 20px;
        }

        #quote4 {
            background-color: #894646;
            border: 3px double #ffffff;
            padding: 15px;
            width: 200px;
            margin: 20px;
        }
    </style>
</head>

<body>
    <div class="quote" id="quote1">
        <p>"Logic will get you from A to B. Imagination will take you everywhere." - Albert Einstein</p>
    </div>
    <div class="quote" id="quote2">
        <p>"Be yourself; everyone else is already taken." - Oscar Wilde</p>
    </div>
    <div class="quote" id="quote3">
        <p>"So many books, so little time." - Frank Zappa</p>
    </div>
    <div class="quote" id="quote4">
        <p>"A room without books is like a body without a soul." - Marcus Tullius Cicero</p>
    </div>

</body>

</html>
